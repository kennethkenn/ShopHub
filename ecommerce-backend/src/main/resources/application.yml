spring:
  application:
    name: ecommerce-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5433/ecommerce_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000 # 24 hours in milliseconds

# Payment Configuration
payment:
  stripe:
    api-key: ${STRIPE_SECRET_KEY:sk_test_your_stripe_key}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret}
  
  mpesa:
    consumer-key: ${MPESA_CONSUMER_KEY:your_consumer_key}
    consumer-secret: ${MPESA_CONSUMER_SECRET:your_consumer_secret}
    shortcode: ${MPESA_SHORTCODE:174379}
    passkey: ${MPESA_PASSKEY:your_passkey}
    callback-url: ${MPESA_CALLBACK_URL:https://yourdomain.com/api/payments/mpesa/callback}
    environment: ${MPESA_ENVIRONMENT:sandbox} # sandbox or production

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Logging
logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
